name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        shell: bash # explicit bash = pipefail, so a failing test fails the step despite tee
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml 2>&1 | tee build.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build.log
            test-results/

  # pgTAP tests in supabase/tests (tenant isolation, status transitions, integrity, email outbox),
  # then end-to-end tests of the Edge Functions against the same stack with a mock email provider.
  # Starts Postgres, the API gateway, PostgREST and Auth in Docker on the runner; no secrets.
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,storage-api,realtime,mailpit,logflare,vector,supavisor,postgres-meta

      # pgTAP tests roll back; they run first because the Edge Function tests change seed data.
      - name: pgTAP tests
        shell: bash # pipefail, so a failing test fails the step despite tee
        run: supabase test db 2>&1 | tee db-test.log

      - name: Edge Function tests
        shell: bash
        env:
          SUPABASE: supabase
        run: ./scripts/test-edge-functions.sh 2>&1 | tee -a db-test.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-test-results
          path: db-test.log

  # Runs only when build or db-tests failed on a PR; posts one comment with the cause of each failure.
  # Read-only except for that comment; never blocks the PR.
  analyze-failures:
    needs: [build, db-tests]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # All artifacts of failed jobs: ci-artifacts/test-results/ and/or ci-artifacts/db-test-results/
      - uses: actions/download-artifact@v4
        with:
          path: ci-artifacts

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Tests failed in CI for pull request #${{ github.event.pull_request.number }}.

            Read the logs in ci-artifacts/: test-results/ (vitest: build.log, junit.xml) and/or
            db-test-results/db-test.log (pgTAP tests from supabase/tests against the migrations, then Edge Function e2e tests from supabase/functions/*/e2e.mjs), and the PR diff
            (git diff origin/${{ github.base_ref }}...HEAD). Use the project rules in CLAUDE.md.

            For each failing test give: the cause, one category
            (Bug in the PR / Test needs updating / Infrastructure or flaky test / Failure not caused by this PR)
            and the minimal fix.

            Post exactly one comment with:
            gh pr comment ${{ github.event.pull_request.number }} --body "<markdown>"
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(gh pr comment:*)"
